name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find project folder
        id: root
        shell: bash
        run: |
          settings="$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1)"
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts not found - the project files were not uploaded correctly"
            find . -maxdepth 2 -not -path './.git*' | head -50
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: 26
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.2

      - name: Build debug APK (arm64)
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle assembleDebug -PabiFilter=arm64-v8a --warning-mode=all

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Only-Player-debug-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
